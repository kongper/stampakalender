name: Nightly scrape and deploy

on:
  schedule:
    # 02:00 UTC daily (~03:00-04:00 Norway). GitHub cron is UTC.
    - cron: "0 2,14 * * *"
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "How many days ahead to scrape"
        required: false
        default: "150"

# Standard for alle jobber er ingen rettigheter; jobben under ber om det den
# faktisk trenger. Da starter en eventuell ny jobb lukket i stedet for åpen.
permissions: {}

# Share the deploy lock with deploy.yml so the two never publish at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # kjøringen tar normalt 5-6 min; stopper en hengt jobb
    permissions:
      contents: write   # commit updated DB + index.html
      pages: write      # deploy to Pages
      id-token: write
      issues: write     # open an alert issue if the scrape returns no data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Alle actions er pinnet til commit-SHA, ikke til flyttbare tagger.
      # En tagg kan flyttes til ondsinnet kode (jf. tj-actions/changed-files,
      # CVE-2025-30066); en SHA kan ikke det. Kommentaren bak viser versjonen —
      # oppdater SHA og kommentar sammen.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"   # løses til nyeste 22.x, så Node-fikser kommer av seg selv

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Eksakt versjon, ikke @latest: pakken lastes ned på nytt hver natt og
      # kjøres i en jobb som har skrivetilgang til repoet. Med @latest ville en
      # kompromittert Playwright-utgivelse truffet oss automatisk samme natt.
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-fund --no-audit playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Scrape source (bestille.no)
        id: scrape
        env:
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '150' }}
        run: node scrape_playwright.js

      - name: Update DB and regenerate index.html
        run: python3 nightly.py

      - name: Commit changes (if any)
        run: |
          git config user.name "stampakalender-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stampakalender.db index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Nightly update $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Remote may have advanced since checkout (manual push or another run).
            # Rebase onto latest main and push, retrying on the race.
            pushed=false
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase --autostash origin main && git push; then
                pushed=true; echo "Pushed on attempt $i"; break
              fi
              echo "Push attempt $i failed; retrying in 5s..."; sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "ERROR: could not push after 3 attempts"; exit 1
            fi
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp CNAME _site/CNAME

      # NB: upload-pages-artifact og deploy-pages MÅ oppgraderes i par. Forrige
      # forsøk bumpet kun upload til v4 mens deploy sto på v4, og feilet med
      # "Multiple artifacts named github-pages". Her står begge på v5.
      # Samme feil kan også oppstå ved re-run av en jobb, uavhengig av versjon,
      # fordi artefakter lever på tvers av forsøk i samme kjøring.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # If the scrape step failed (0 bookings / source changed), open or update
      # a GitHub issue so the breakage is noticed. Runs only for scrape failures,
      # not push/deploy hiccups. The DB/site are untouched on this path.
      - name: Alert if scrape returned no data
        if: failure() && steps.scrape.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create nightly-failure --color B60205 \
            --description "Nightly scrape failure" 2>/dev/null || true
          TITLE="Nightly scrape found no bookings ($(date -u +%Y-%m-%d))"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n' \
            "The nightly Stampakalender scrape failed — usually this means **0 bookings** were returned for a source, which points to a change in the bestille.no page structure." \
            "" \
            "The run aborted before \`nightly.py\`, so the database and live site were **not** modified." \
            "" \
            "Failed run: $RUN_URL")
          existing=$(gh issue list --label nightly-failure --state open \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label nightly-failure --body "$BODY"
          fi
